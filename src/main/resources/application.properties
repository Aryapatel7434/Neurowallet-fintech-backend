# ============================================================
# NEUROWALLET - APPLICATION CONFIGURATION
# ============================================================

spring.application.name=smartwallet-backend
server.port=${SERVER_PORT:8080}


# ============================================================
# DATABASE - MYSQL
# ============================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smartwalletdb}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false


# ============================================================
# REDIS CACHE
# ============================================================

spring.cache.type=${CACHE_TYPE:redis}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

spring.cache.redis.time-to-live=10m
spring.cache.redis.cache-null-values=false


# ============================================================
# EMAIL - GMAIL SMTP
# ============================================================

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.required=true


# ============================================================
# APACHE KAFKA
# ============================================================

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.consumer.group-id=neurowallet-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Kafka Producer Reliability
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.retry.backoff.ms=1000
spring.kafka.producer.properties.max.block.ms=5000


# ============================================================
# GOOGLE GEMINI - SPRING AI
# ============================================================

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-3.5-flash-lite}

spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=500ms
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=2s


# ============================================================
# JWT AUTHENTICATION
# ============================================================

jwt.secret=${JWT_SECRET}


# ============================================================
# SPRING BOOT ACTUATOR
# ============================================================

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.info.env.enabled=false
management.health.mail.enabled=false
management.health.redis.enabled=false

info.app.name=NeuroWallet AI Fintech Platform
info.app.description=Smart Wallet Backend with JWT, Kafka, Docker, MySQL and Monitoring
info.app.version=1.0.0


# ============================================================
# LOGGING
# ============================================================

# Console logging is preferred for container deployments.
# Local file logging can be enabled separately when required.

logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.smartwallet=${APP_LOG_LEVEL:INFO}

logging.level.org.apache.kafka=ERROR
logging.level.kafka=ERROR
logging.level.org.springframework.kafka=ERROR

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %level - [%X{requestId}] - %logger{36} - %msg%n


# ============================================================
# SWAGGER / OPENAPI
# ============================================================

springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
# Frontend URL
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

