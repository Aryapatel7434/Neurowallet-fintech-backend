spring.application.name=smartwallet-backend

spring.datasource.url=jdbc:mysql://localhost:3306/smartwalletdb
spring.datasource.username=root
spring.datasource.password=Arya@

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

server.port=8080

# ============================================================
# REDIS CACHE
# ============================================================

spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.cache.redis.time-to-live=10m
spring.cache.redis.cache-null-values=false

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=arypatel913@gmail.com
spring.mail.password=jxgbcxsdbbghkfwq

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.required=true

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=neurowallet-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Kafka Producer Reliability
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.retry.backoff.ms=1000
spring.kafka.producer.properties.max.block.ms=5000

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.5-flash-lite

spring.ai.retry.max-attempts=5
spring.ai.retry.backoff.initial-interval=2s
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=15s

# ============================================================
# ACTUATOR
# ============================================================

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.info.env.enabled=false
management.health.mail.enabled=false
management.health.redis.enabled=false

info.app.name=NeuroWallet AI Fintech Platform
info.app.description=Smart Wallet Backend with JWT, Kafka, Docker, MySQL and Monitoring
info.app.version=1.0.0

# ============================================================
# LOGGING
# ============================================================

logging.file.name=logs/neurowallet-app.log

logging.level.root=INFO
logging.level.com.smartwallet=DEBUG

logging.level.org.apache.kafka=ERROR
logging.level.kafka=ERROR
logging.level.org.springframework.kafka=ERROR

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %level - [%X{requestId}] - %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} - %level - [%X{requestId}] - %logger{36} - %msg%n

# ============================================================
# SWAGGER / OPENAPI
# ============================================================

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

jwt.secret=${JWT_SECRET}